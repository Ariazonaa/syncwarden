name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run zip

      - uses: actions/upload-artifact@v4
        with:
          name: syncwarden-chrome
          path: .output/*-chrome.zip
          # .output is a dot directory; upload-artifact skips those by default.
          include-hidden-files: true
          if-no-files-found: error
